# 项目级 Ansible 配置：与 playbook 同仓库提交，在各机器上 clone 后直接可用
[defaults]
# 角色搜索路径：site.yml 在 playbooks/ 下，roles/ 在项目根，
# 不指定的话 Ansible 只搜 playbooks/roles（默认不存在），报 "role not found"
roles_path = roles

# 默认 inventory：在项目根目录运行时可省略 -i 参数
inventory = inventory/hosts.ini

# 首次连接目标机免交互确认（与 inventory 里的 StrictHostKeyChecking=no 等效）
host_key_checking = False

# 抑制「发现的 Python 解释器」告警（Ubuntu 22.04 无实际影响）
interpreter_python = auto_silent
