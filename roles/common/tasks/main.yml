---
# 1. 更新apt软件缓存，缓存有效期1小时
- name: 更新 apt 软件缓存
  apt:
    update_cache: yes
    cache_valid_time: 3600

# 2. 安装基础工具包（列表见 defaults/main.yml 的 common_packages）
- name: 安装系统基础工具
  apt:
    name: "{{ common_packages }}"
    state: present

# 3. 创建部署用户，变量 deploy_user 在 group_vars/all.yml
- name: 创建部署用户 {{ deploy_user }}
  user:
    name: "{{ deploy_user }}"
    groups: "{{ common_deploy_user_groups }}"
    shell: "{{ common_deploy_user_shell }}"
    create_home: yes
    append: yes

# 4. 推送本机公钥到远程这个用户，实现ssh免密登录
- name: 给部署用户配置ssh公钥免密登录
  authorized_key:
    user: "{{ deploy_user }}"
    key: "{{ lookup('file', common_ssh_public_key_file) }}"
    state: present

# 5. 设置系统时区
- name: 设置系统时区为 {{ timezone }}
  timezone:
    name: "{{ timezone }}"

# 6. 配置sudo免密码，ansible执行sudo不需要输入密码
- name: 配置 {{ deploy_user }} sudo 免密
  template:
    src: sudoers.j2
    dest: "{{ common_sudoers_dir }}/{{ deploy_user }}"
    owner: root
    group: root
    mode: '0440'
    validate: 'visudo -cf %s'
  when: common_sudo_nopasswd

