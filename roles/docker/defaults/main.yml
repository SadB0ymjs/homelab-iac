---
# docker 角色可调参数
# 优先级最低，会被 group_vars/all.yml 或 playbook 中的同名变量覆盖

# ---- apt 软件源（国内阿里云镜像站）----
# Docker 官方 GPG key 的镜像地址
# 发行版自动适配：Ubuntu 解析为 ubuntu、Debian 解析为 debian
docker_apt_gpg_key_url: "https://mirrors.aliyun.com/docker-ce/linux/{{ ansible_distribution | lower }}/gpg"

# Docker CE apt 软件源（阿里云镜像站），{{ ansible_distribution_release }} 会替换成
# focal / jammy（Ubuntu）或 bullseye / bookworm（Debian）等版本代号
docker_apt_repository: >
  deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
  https://mirrors.aliyun.com/docker-ce/linux/{{ ansible_distribution | lower }}
  {{ ansible_distribution_release }} stable

# GPG key 存放路径（apt 源的 signed-by 指向这里，.asc 为 ASCII 格式，新版 apt 直接支持）
docker_apt_keyring_path: /etc/apt/keyrings/docker.asc

# ---- 安装内容 ----
# 要安装的 Docker 相关包
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# 允许降级安装（保持默认即可）
docker_allow_downgrade: false

# ---- Docker 服务 ----
docker_service_name: docker
docker_service_state: started
docker_service_enabled: true

# 将部署用户加入 docker 组（免 sudo 使用 docker 命令）
docker_group_members:
  - "{{ deploy_user | default('ops') }}"

# ---- 镜像加速器 ----
# Docker Hub 官方源国内拉取缓慢/中断，配置多个加速器做冗余（按序回退）。
# 公共加速器（daocloud/网易等）免费但高峰期会 502；
# 稳定方案：阿里云「容器镜像服务 → 镜像加速器」页面的个人专属地址
# https://<你的ID>.mirror.aliyuncs.com 填到 group_vars 覆盖此项
docker_registry_mirrors:
  - "https://docker.m.daocloud.io"
  - "https://docker.1ms.run"

# daemon.json 其他配置项（log 大小限制，避免日志撑爆磁盘）
docker_log_driver: json-file
docker_log_max_size: 50m
docker_log_max_file: "3"
